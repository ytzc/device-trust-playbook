<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Device Trust Playbook</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f8fb;
      color: #1f2937;
    }
    header {
      padding: 64px 24px;
      text-align: center;
      color: white;
      background: linear-gradient(135deg, #111827, #374151);
    }
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 24px;
    }
    .card {
      background: white;
      border-radius: 18px;
      padding: 28px;
      margin-bottom: 24px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
    }
    .version {
      display: inline-block;
      margin-top: 16px;
      padding: 8px 14px;
      border-radius: 999px;
      background: #e0f2fe;
      color: #075985;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <header>
    <h1>Device Trust & Platform Security Playbook</h1>
    <p>設備信任、Root of Trust、Provisioning、Onboarding、Attestation 知識庫</p>
    <div class="version">Version: __VERSION__</div>
  </header>

  <main>
    <section class="card">
      <h2>Deployment Test / 部署測試</h2>
      <p>
        This page is deployed to GitHub Pages only when a version tag is pushed.
      </p>
      <p>
        此頁面只有在推送版本 tag，例如 v0.1.0 時，才會部署到 GitHub Pages。
      </p>
    </section>
  </main>
</body>
</html>
